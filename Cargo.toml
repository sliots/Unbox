[workspace]
resolver = "2"
members = ["crates/unbox-core", "crates/unbox"]

[workspace.package]
version = "2.0.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/sliots/Unbox"
rust-version = "1.85"

[workspace.dependencies]
unbox-core = { path = "crates/unbox-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
