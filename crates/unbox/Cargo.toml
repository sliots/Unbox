[package]
name = "unbox"
description = "Double-click to extract: a Windows 11 copy-dialog style extraction agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "unbox"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
unbox-core.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast.workspace = true
slint = { version = "=1.19.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "unstable-winit-030",
    "renderer-skia-software",
    "raw-window-handle-06",
    "accessibility",
] }
raw-window-handle = "0.6"
windows-core = "=0.62.2"
rfd = { version = "=0.18.0", default-features = false }
winreg = "=0.56.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.19.1"
winresource = "=0.1.34"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.6"
resvg = "0.50"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
