name: CI

on:
  push:
    branches: [rust]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core rules (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p unbox-core

  windows:
    name: Build and smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -p unbox --release -- -D warnings
      - name: Package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -PackageDir "${{ steps.package.outputs.dir }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
