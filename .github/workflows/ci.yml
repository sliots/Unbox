name: CI

on:
  push:
    branches: [rust]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes the older run; pushes to the branch never cancel each
# other, because Release reuses the package built for the exact tagged commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core rules (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all --check
      - run: cargo test --locked -p unbox-core

  windows:
    uses: ./.github/workflows/build.yml
    with:
      save-cache: ${{ github.event_name != 'pull_request' }}
